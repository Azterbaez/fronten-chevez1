<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#221d1d">
  <title>Chevez Mobile BI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      font-family: "DM Sans", sans-serif;
      color: #292421;
      background: #f5f2ef;
      font-synthesis: none;
      --ink: #292421;
      --muted: #77716d;
      --canvas: #f5f2ef;
      --paper: #fff;
      --line: #e9e3de;
      --wine: #750d32;
      --lime: #d8e707;
      --green: #287755;
      --red: #a63338;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    button { font: inherit; cursor: pointer; }
    .app { min-height: 100vh; }
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 20; display: flex; width: 244px; flex-direction: column; padding: 27px 18px 18px; color: #fff; background: var(--ink); }
    .brand { padding: 0 10px 29px; border-bottom: 1px solid #ffffff20; }
    .brand-name { margin: 0; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 800; }
    .brand-name span { color: var(--lime); }
    .brand-caption { margin: 5px 0 0; color: #c7bfbb; font-size: 10px; font-weight: 700; letter-spacing: .08em; }
    .nav-label { margin: 27px 10px 10px; color: #a69e99; font-size: 9px; font-weight: 800; letter-spacing: .12em; }
    .nav-list { display: grid; gap: 5px; }
    .nav-item { display: flex; min-height: 45px; align-items: center; gap: 12px; padding: 0 11px; border: 0; border-radius: 5px; color: #d6cfcb; background: transparent; text-align: left; font-size: 13px; font-weight: 600; }
    .nav-item:hover { background: #ffffff0d; color: #fff; }
    .nav-item.active { color: var(--ink); background: var(--lime); }
    .nav-icon { width: 20px; font-size: 16px; text-align: center; }
    .sidebar-foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid #ffffff20; color: #c7bfbb; font-size: 10px; }
    .sidebar-foot strong { display: block; margin-bottom: 4px; color: #fff; font-size: 12px; }
    .workspace { min-height: 100vh; margin-left: 244px; }
    .topbar { position: sticky; top: 0; z-index: 10; display: flex; min-height: 68px; align-items: center; justify-content: space-between; gap: 16px; padding: 0 34px; border-bottom: 1px solid var(--line); background: #f5f2eff2; backdrop-filter: blur(12px); }
    .breadcrumb { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; }
    .breadcrumb strong { color: var(--ink); font-weight: 700; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .connection { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
    .connection::before { width: 7px; height: 7px; border-radius: 50%; background: #b7b0aa; content: ""; }
    .connection.online::before { background: var(--green); }
    .icon-button { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: var(--paper); font-size: 18px; }
    .icon-button:hover { border-color: var(--wine); color: var(--wine); }
    .cart-button { position: relative; }
    .cart-badge { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; color: var(--ink); background: var(--lime); font-size: 9px; font-weight: 800; line-height: 18px; text-align: center; }
    .cart-badge[hidden] { display: none; }
    .menu-button { display: none; }
    main { width: min(1180px, 100%); margin: 0 auto; padding: 30px 34px 70px; }
    .notice { margin: 0 0 17px; padding: 11px 14px; border-radius: 5px; color: var(--red); background: #f8e9e8; font-size: 12px; }
    .notice.success { color: var(--green); background: #e6f2ea; }
    .notice:empty { display: none; }
    .toast { position: fixed; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); left: 50%; z-index: 30; max-width: min(340px, calc(100% - 32px)); padding: 12px 16px; border-radius: 6px; color: #fff; background: var(--ink); box-shadow: 0 12px 32px #29242130; font-size: 12px; font-weight: 600; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .eyebrow { margin: 0 0 7px; color: var(--wine); font-size: 10px; font-weight: 800; letter-spacing: .1em; }
    h1, h2, p { overflow-wrap: anywhere; }
    h1 { margin: 0; font-family: Manrope, sans-serif; font-size: 32px; font-weight: 800; }
    .page-subtitle { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
    .hero { position: relative; display: flex; min-height: 246px; align-items: end; justify-content: space-between; gap: 20px; overflow: hidden; margin-bottom: 30px; padding: 27px 30px; border-radius: 6px; color: #fff; background: var(--wine); }
    .hero::after { position: absolute; top: -76px; right: 8%; width: 300px; height: 300px; border: 1px solid #ffffff28; border-radius: 50%; box-shadow: 0 0 0 32px #ffffff0b, 0 0 0 66px #ffffff08; content: ""; }
    .hero-copy { position: relative; z-index: 1; max-width: 500px; }
    .hero .eyebrow { color: #f3d6e1; }
    .hero h1 { max-width: 460px; font-size: 37px; line-height: 1.14; }
    .hero p { max-width: 390px; margin: 10px 0 0; color: #f0dae2; font-size: 13px; line-height: 1.6; }
    .hero-stat { position: relative; z-index: 1; min-width: 165px; padding-left: 20px; border-left: 1px solid #ffffff52; }
    .hero-stat span { display: block; color: #f0dae2; font-size: 9px; font-weight: 800; letter-spacing: .08em; }
    .hero-stat strong { display: block; margin-top: 7px; color: var(--lime); font-family: Manrope, sans-serif; font-size: 32px; }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 27px 0 14px; }
    .section-title h2 { margin: 0; font-family: Manrope, sans-serif; font-size: 17px; }
    .text-button { padding: 6px 0; border: 0; color: var(--wine); background: transparent; font-size: 12px; font-weight: 700; }
    .text-button:hover { text-decoration: underline; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }
    .stat { min-height: 116px; padding: 16px; border-radius: 5px; background: var(--paper); }
    .stat.dark { color: #fff; background: var(--ink); }
    .stat.lime { background: var(--lime); }
    .stat-label { margin: 0; color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .06em; }
    .stat.dark .stat-label { color: #d4ccca; }
    .stat-value { margin: 10px 0 4px; font-family: Manrope, sans-serif; font-size: 26px; font-weight: 800; }
    .stat-note { margin: 0; color: var(--muted); font-size: 10px; }
    .stat.dark .stat-note { color: #d4ccca; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 0 14px; }
    .toolbar p { margin: 0; color: var(--muted); font-size: 11px; font-weight: 800; }
    .toolbar-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
    .search { width: min(280px, 100%); height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 5px; outline: none; color: var(--ink); background: var(--paper); font: inherit; font-size: 12px; }
    .search:focus { border-color: var(--wine); }
    .segments { display: flex; gap: 3px; padding: 3px; border-radius: 5px; background: #eae4df; }
    .segment { min-height: 34px; padding: 0 13px; border: 0; border-radius: 3px; color: var(--muted); background: transparent; font-size: 11px; font-weight: 700; }
    .segment.active { color: var(--ink); background: var(--paper); }
    .primary-button { min-height: 40px; padding: 0 15px; border: 0; border-radius: 4px; color: #fff; background: var(--wine); font-size: 11px; font-weight: 800; }
    .primary-button:disabled { opacity: .55; cursor: wait; }
    .catalog-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
    .catalog-card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); cursor: pointer; transition: transform .18s ease, box-shadow .18s ease; animation: rise .28s both; }
    .catalog-card:hover { transform: translateY(-3px); box-shadow: 0 9px 25px #29242116; }
    .catalog-image-wrap { position: relative; height: 205px; overflow: hidden; background: #e7e1dc; }
    .catalog-image { width: 100%; height: 100%; object-fit: cover; transition: transform .3s ease; }
    .catalog-card:hover .catalog-image { transform: scale(1.035); }
    .image-placeholder { display: grid; width: 100%; height: 100%; place-items: center; color: #a19790; background: linear-gradient(145deg, #ede8e3, #ded7d1); font-size: 11px; font-weight: 700; }
    .stock-badge { position: absolute; right: 10px; bottom: 10px; padding: 6px 9px; border-radius: 3px; color: var(--ink); background: var(--lime); font-size: 9px; font-weight: 800; }
    .catalog-copy { padding: 14px 15px 16px; }
    .catalog-kicker { margin: 0 0 5px; color: var(--wine); font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .catalog-name { margin: 0; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 800; }
    .catalog-description { display: -webkit-box; min-height: 34px; overflow: hidden; margin: 6px 0 12px; color: var(--muted); font-size: 11px; line-height: 1.55; line-clamp: 2; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .catalog-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
    .catalog-price { color: var(--ink); font-family: Manrope, sans-serif; font-size: 16px; font-weight: 800; }
    .catalog-link { color: var(--wine); font-size: 10px; font-weight: 800; }
    .cart-add-button { min-height: 32px; padding: 0 10px; border: 0; border-radius: 4px; color: #fff; background: var(--wine); font-size: 9px; font-weight: 800; white-space: nowrap; }
    .cart-add-button:hover { filter: brightness(1.06); }
    .cart-add-button:disabled { opacity: .5; cursor: not-allowed; }
    .cart-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr); gap: 20px; align-items: start; }
    .cart-list { display: grid; gap: 10px; }
    .cart-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); }
    .cart-item-name { margin: 0; font-size: 13px; font-weight: 800; }
    .cart-item-meta { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .cart-item-controls { display: flex; align-items: center; gap: 8px; }
    .qty-button { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: var(--canvas); font-size: 16px; font-weight: 700; }
    .qty-value { min-width: 22px; text-align: center; font-size: 13px; font-weight: 800; }
    .cart-remove { padding: 6px 0; border: 0; color: var(--red); background: transparent; font-size: 10px; font-weight: 700; }
    .checkout-panel { position: sticky; top: 84px; padding: 18px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
    .checkout-panel h2 { margin: 0 0 12px; font-family: Manrope, sans-serif; font-size: 17px; }
    .field-label { display: block; margin: 0 0 7px; font-size: 11px; font-weight: 800; }
    .select-input { width: 100%; height: 42px; margin-bottom: 14px; padding: 0 11px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: var(--paper); font: inherit; font-size: 12px; }
    .payment-toggle { display: flex; gap: 6px; margin-bottom: 16px; }
    .payment-option { flex: 1; min-height: 38px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); background: var(--canvas); font-size: 11px; font-weight: 700; }
    .payment-option.active { border-color: var(--wine); color: #fff; background: var(--wine); }
    .checkout-total { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding: 14px; border-radius: 5px; color: #fff; background: var(--ink); }
    .checkout-total span { font-size: 10px; font-weight: 800; letter-spacing: .06em; }
    .checkout-total strong { color: var(--lime); font-family: Manrope, sans-serif; font-size: 22px; }
    .secondary-button { min-height: 40px; padding: 0 15px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: var(--paper); font-size: 11px; font-weight: 800; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .record-list { display: grid; gap: 8px; }
    .record-row { display: flex; min-height: 72px; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); }
    .record-mark { display: grid; width: 38px; height: 38px; flex: 0 0 38px; place-items: center; border-radius: 4px; color: var(--wine); background: #f5e9ee; font-size: 15px; font-weight: 800; }
    .record-copy { min-width: 0; flex: 1; }
    .record-name { margin: 0; font-size: 13px; font-weight: 800; }
    .record-detail { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .detail-layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(240px, .75fr); gap: 24px; align-items: start; }
    .detail-image { width: 100%; max-height: 510px; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 5px; background: #e7e1dc; }
    .detail-panel { padding: 21px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); }
    .detail-panel h2 { margin: 5px 0 10px; font-family: Manrope, sans-serif; font-size: 23px; }
    .detail-description { color: var(--muted); font-size: 12px; line-height: 1.7; }
    .detail-price { margin: 17px 0; color: var(--wine); font-family: Manrope, sans-serif; font-size: 28px; font-weight: 800; }
    .detail-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 18px; }
    .fact { padding: 12px; border-radius: 4px; background: var(--canvas); }
    .fact span { display: block; color: var(--muted); font-size: 9px; font-weight: 800; }
    .fact strong { display: block; margin-top: 5px; font-size: 12px; }
    .empty, .loading { padding: 42px 20px; border: 1px dashed #d5cdc7; border-radius: 5px; color: var(--muted); background: #ffffff80; text-align: center; font-size: 12px; }
    .action-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 12px; }
    .record-row { cursor: default; }
    .record-edit { padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; color: var(--wine); background: var(--paper); font-size: 10px; font-weight: 800; }
    .profile-card { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; padding: 18px; border-radius: 6px; color: #fff; background: var(--wine); }
    .profile-monogram { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 50%; color: var(--wine); background: var(--lime); font-family: Manrope, sans-serif; font-size: 21px; font-weight: 900; }
    .profile-name { margin: 0; font-size: 15px; font-weight: 800; }
    .profile-caption { margin: 5px 0 0; color: #f4dde5; font-size: 9px; font-weight: 700; letter-spacing: .06em; }
    .menu-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 62px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); margin-bottom: 8px; cursor: pointer; }
    .menu-row:hover { border-color: var(--wine); }
    .menu-name { margin: 0; font-size: 13px; font-weight: 800; }
    .menu-caption { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .menu-arrow { color: var(--wine); font-size: 22px; }
    .tool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
    .tool-button { min-height: 42px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: var(--paper); font-size: 10px; font-weight: 800; text-align: left; }
    .tool-button:hover { border-color: var(--wine); color: var(--wine); }
    .stats-panel { display: grid; gap: 8px; margin-bottom: 16px; padding: 14px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); }
    .stats-panel p { margin: 0; font-size: 11px; color: var(--muted); }
    .stats-panel strong { color: var(--ink); font-size: 13px; }
    .clima-list { display: grid; gap: 6px; max-height: 220px; overflow: auto; margin-top: 10px; }
    .clima-row { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 4px; background: var(--canvas); font-size: 11px; }
    .editor-scrim { position: fixed; inset: 0; z-index: 40; display: none; align-items: end; justify-content: center; padding: 0; background: #17131380; }
    .editor-scrim.open { display: flex; }
    .editor-panel { width: min(560px, 100%); max-height: min(92vh, 900px); overflow: auto; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); border-radius: 12px 12px 0 0; background: var(--canvas); box-shadow: 0 -8px 40px #29242125; }
    @media (min-width: 701px) { .editor-scrim { align-items: center; padding: 20px; } .editor-panel { border-radius: 8px; max-height: min(88vh, 900px); } }
    .editor-header { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .editor-title { margin: 4px 0 0; font-family: Manrope, sans-serif; font-size: 22px; font-weight: 800; }
    .editor-close { width: 38px; height: 38px; border: 0; border-radius: 50%; color: var(--ink); background: var(--paper); font-size: 24px; line-height: 1; }
    .form-field { margin-bottom: 12px; }
    .form-input, .form-textarea { width: 100%; min-height: 42px; padding: 0 11px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); background: var(--paper); font: inherit; font-size: 12px; }
    .form-textarea { min-height: 84px; padding-top: 10px; resize: vertical; }
    .choice-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .choice-chip { min-height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); background: var(--paper); font-size: 11px; font-weight: 700; }
    .choice-chip.active { border-color: var(--wine); color: #fff; background: var(--wine); }
    .order-line { margin-bottom: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); }
    .inline-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-error { margin: 0 0 10px; padding: 10px 12px; border-radius: 5px; color: var(--red); background: #f8e9e8; font-size: 11px; }
    .image-preview { width: 100%; max-height: 180px; object-fit: cover; margin-bottom: 8px; border-radius: 5px; background: #e7e1dc; }
    .mobile-tabs { display: none; }
    .drawer-scrim { display: none; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 1050px) { .catalog-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 700px) {
      .sidebar { width: min(288px, 84vw); transform: translateX(-102%); transition: transform .22s ease; box-shadow: 15px 0 45px #17131330; }
      .sidebar.open { transform: translateX(0); }
      .drawer-scrim.visible { position: fixed; inset: 0; z-index: 19; display: block; background: #17131380; }
      .workspace { margin-left: 0; padding-bottom: 66px; }
      .topbar { min-height: 59px; padding: 0 15px; }
      .menu-button { display: grid; }
      .breadcrumb { flex: 1; gap: 6px; font-size: 11px; }
      .connection { display: none; }
      main { padding: 24px 16px 38px; }
      .hero { min-height: 222px; align-items: start; flex-direction: column; justify-content: space-between; padding: 23px; }
      .hero h1 { max-width: 300px; font-size: 31px; }
      .hero-stat { min-width: 0; padding: 9px 0 0; border-top: 1px solid #ffffff52; border-left: 0; }
      .hero-stat strong { display: inline-block; margin-left: 9px; font-size: 22px; }
      .stats { gap: 8px; }
      .stat { min-height: 101px; padding: 12px; }
      .stat-value { font-size: 22px; }
      .page-heading { align-items: start; flex-direction: column; margin-bottom: 18px; }
      h1 { font-size: 28px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .toolbar-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
      .search { width: 100%; }
      .catalog-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .catalog-image-wrap { height: 150px; }
      .catalog-copy { padding: 11px; }
      .catalog-name { font-size: 13px; }
      .catalog-description { min-height: 32px; font-size: 10px; }
      .catalog-price { font-size: 14px; }
      .catalog-link { font-size: 9px; }
      .detail-layout { grid-template-columns: 1fr; gap: 13px; }
      .detail-image { aspect-ratio: 4 / 3; }
      .mobile-tabs { position: fixed; inset: auto 0 0; z-index: 15; display: grid; min-height: 62px; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 5px 3px max(5px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #fff; }
      .cart-layout { grid-template-columns: 1fr; }
      .checkout-panel { position: static; }
      .mobile-tab { display: grid; align-content: center; justify-items: center; gap: 3px; border: 0; color: var(--muted); background: transparent; font-size: 9px; font-weight: 700; }
      .mobile-tab span:first-child { font-size: 15px; }
      .mobile-tab.active { color: var(--wine); }
    }
    @media (max-width: 380px) { .catalog-grid { grid-template-columns: 1fr; } .catalog-image-wrap { height: 205px; } .toolbar-controls { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }

<body>
  <div class="app">

  </div>
  <script>
    const API_URL = 'https://prueva-1-wuwk.onrender.com';
    const modules = [
      { key: 'productos', label: 'Productos', path: '/api/productos/productos', item: '/api/productos/producto' },
      { key: 'categorias', label: 'Categorías', path: '/api/categorias/categorias', item: '/api/categorias/categoria' },
      { key: 'clientes', label: 'Clientes', path: '/api/clientes/clientes', item: '/api/clientes/cliente' },
      { key: 'pedidos', label: 'Pedidos', path: '/api/pedidos/pedidos', item: '/api/pedidos/pedido' },
      { key: 'creditos', label: 'Créditos', path: '/api/creditos/creditos', item: '/api/creditos/credito' },
    ];
    const moduleByKey = key => modules.find(module => module.key === key);
    const CART_STORAGE_KEY = 'chevez-mobile-cart';
    const sections = [
      { id: 'home', label: 'Inicio', icon: '⌂' },
      { id: 'catalog', label: 'Catálogo', icon: '▦' },
      { id: 'cart', label: 'Carrito', icon: '🛒' },
      { id: 'orders', label: 'Pedidos', icon: '↗' },
      { id: 'history', label: 'Historial', icon: '◷' },
      { id: 'profile', label: 'Perfil', icon: '◎' },
    ];
    const today = () => new Date().toISOString().slice(0, 10);
    function routeStackFromLocation() {
      const [screen, encodedId] = location.hash.slice(1).split('/');
      if (screen === 'detail' && encodedId) return [{ screen: 'catalog' }, { screen: 'detail', id: decodeURIComponent(encodedId) }];
      if (screen === 'clients') return [{ screen: 'clients' }];
      if (sections.some(section => section.id === screen)) return [{ screen }];
      return [{ screen: 'home' }];
    }
    const page = document.getElementById('page');
    const notice = document.getElementById('notice');
    const drawer = document.getElementById('drawer');
    const drawerScrim = document.getElementById('drawerScrim');
    const connection = document.getElementById('connection');
    function loadCartFromStorage() {
      try {
        const raw = localStorage.getItem(CART_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }
    const state = {
      records: Object.fromEntries(modules.map(module => [module.key, []])),
      stack: routeStackFromLocation(),
      catalogKind: 'productos',
      historyKind: 'pedidos',
      search: '',
      loading: false,
      cart: loadCartFromStorage(),
      checkout: { clienteRef: '', metodoPago: true, submitting: false },
      editor: null,
      apiStats: null,
      clima: null,
      toastTimer: null,
    };
    const referenceId = value => {
      if (typeof value === 'string') return value.split('/').pop();
      return recordId(value);
    };
    async function apiRequest(path, options = {}) {
      const response = await fetch(`${API_URL}${path}`, options);
      const text = await response.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch { data = { mensaje: text }; }
      if (!response.ok) throw new Error(data.mensaje || data.message || `Error ${response.status}`);
      return data;
    }
    function openExport(path, label) {
      window.open(`${API_URL}${path}`, '_blank', 'noopener');
      showToast(label || 'Descarga iniciada');
    }
    const current = () => state.stack[state.stack.length - 1];
    const recordId = record => String(record?.id || record?._id || '');
    const money = value => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(Number(value) || 0);
    const formatDate = value => {
      const date = value && typeof value === 'object' ? value.fecha || value.$date || value.toDate?.() : value;
      if (!date) return 'Sin fecha';
      const parsed = new Date(date);
      return Number.isNaN(parsed.getTime()) ? String(date) : new Intl.DateTimeFormat('es-MX', { dateStyle: 'medium' }).format(parsed);
    };
    const make = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    };
    const validImage = value => typeof value === 'string' && /^https?:\/\//i.test(value);
    function setNotice(message, variant = 'error') {
      notice.textContent = message || '';
      notice.classList.toggle('success', variant === 'success');
    }
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('visible');
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => toast.classList.remove('visible'), 2400);
    }
    function syncCartBadge() {
      const count = state.cart.reduce((sum, item) => sum + (Number(item.cantidad) || 0), 0);
      const badge = document.getElementById('cartBadge');
      badge.textContent = count > 99 ? '99+' : String(count);
      badge.hidden = count === 0;
    }
    function persistCart() {
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(state.cart));
      syncCartBadge();
    }
    function cartLineTotal(item) {
      return (Number(item.cantidad) || 0) * (Number(item.precio) || 0);
    }
    function cartGrandTotal() {
      return state.cart.reduce((sum, item) => sum + cartLineTotal(item), 0);
    }
    function productById(id) {
      return state.records.productos.find(item => recordId(item) === id);
    }
    function canAddProduct(record, extra = 1) {
      if (record?.estado === false) return { ok: false, message: 'Este producto está inactivo.' };
      const stock = Number(record?.stock);
      if (!Number.isFinite(stock) || stock <= 0) return { ok: false, message: 'Sin existencias disponibles.' };
      const existing = state.cart.find(item => item.productoRef === recordId(record));
      const nextQty = (existing?.cantidad || 0) + extra;
      if (nextQty > stock) return { ok: false, message: `Solo hay ${stock} disponibles.` };
      return { ok: true };
    }
    function addToCart(record, quantity = 1) {
      const id = recordId(record);
      const qty = Math.max(1, Number(quantity) || 1);
      const check = canAddProduct(record, qty);
      if (!check.ok) {
        setNotice(check.message);
        return;
      }
      const existing = state.cart.find(item => item.productoRef === id);
      if (existing) {
        existing.cantidad = Number(existing.cantidad) + qty;
        existing.precio = Number(record.precio) || existing.precio;
        existing.nombre = record.nombre || existing.nombre;
      } else {
        state.cart.push({
          productoRef: id,
          cantidad: qty,
          precio: Number(record.precio) || 0,
          nombre: record.nombre || 'Producto',
        });
      }
      persistCart();
      showToast(`${record.nombre || 'Producto'} agregado al carrito`);
      setNotice('');
    }
    function setCartQuantity(productoRef, cantidad) {
      const item = state.cart.find(entry => entry.productoRef === productoRef);
      if (!item) return;
      const product = productById(productoRef);
      const qty = Math.max(1, Number(cantidad) || 1);
      const stock = Number(product?.stock);
      if (Number.isFinite(stock) && stock > 0 && qty > stock) {
        setNotice(`Solo hay ${stock} disponibles.`);
        return;
      }
      item.cantidad = qty;
      if (product?.precio != null) item.precio = Number(product.precio);
      persistCart();
      setNotice('');
      if (current().screen === 'cart') render();
    }
    function removeFromCart(productoRef) {
      state.cart = state.cart.filter(item => item.productoRef !== productoRef);
      persistCart();
      if (current().screen === 'cart') render();
    }
    function clearCart() {
      state.cart = [];
      persistCart();
    }
    function validateCartStock() {
      for (const item of state.cart) {
        const product = productById(item.productoRef);
        const qty = Number(item.cantidad) || 0;
        const stock = Number(product?.stock);
        if (!product) return { ok: false, message: 'Hay productos en el carrito que ya no existen.' };
        if (product.estado === false) return { ok: false, message: `"${product.nombre}" está inactivo.` };
        if (!Number.isFinite(stock) || qty > stock) return { ok: false, message: `Stock insuficiente para "${product.nombre}". Disponible: ${stock}.` };
      }
      return { ok: true };
    }
    async function submitCartOrder() {
      if (state.checkout.submitting) return;
      if (!state.cart.length) {
        setNotice('Agrega productos al carrito antes de confirmar.');
        return;
      }
      if (!state.checkout.clienteRef) {
        setNotice('Selecciona un cliente para registrar el pedido.');
        return;
      }
      const stockCheck = validateCartStock();
      if (!stockCheck.ok) {
        setNotice(stockCheck.message);
        return;
      }
      const detalles = state.cart.map(item => ({
        productoRef: item.productoRef,
        cantidad: Number(item.cantidad),
        precio: Number(item.precio),
        subtotal: cartLineTotal(item),
      }));
      const payload = {
        clienteRef: state.checkout.clienteRef,
        fecha: today(),
        estado: false,
        metodoPago: state.checkout.metodoPago,
        total: cartGrandTotal(),
        detalles,
      };
      state.checkout.submitting = true;
      setNotice('');
      render();
      try {
        const response = await fetch(`${API_URL}/api/pedidos/pedido`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.mensaje || data.message || `Error ${response.status}`);
        clearCart();
        state.checkout.clienteRef = state.records.clientes[0] ? recordId(state.records.clientes[0]) : '';
        setNotice(data.mensaje || 'Pedido registrado correctamente.', 'success');
        showToast('Pedido enviado');
        await loadCollections();
        setRoute('orders');
      } catch (error) {
        setNotice(error.message || 'No se pudo registrar el pedido.');
      } finally {
        state.checkout.submitting = false;
        render();
      }
    }
    function createForm(entity, record) {
      const records = state.records;
      if (record) {
        const form = { ...record, imageFile: null };
        ['clienteRef', 'productoRef', 'categoriaRef'].forEach(key => {
          if (form[key]) form[key] = referenceId(form[key]);
        });
        if (Array.isArray(form.detalles)) {
          form.detalles = form.detalles.map(row => ({ ...row, productoRef: referenceId(row.productoRef) }));
        }
        if (Array.isArray(form.abonos)) form.abonos = form.abonos.map(row => ({ ...row }));
        return form;
      }
      const defaults = {
        categorias: { nombre: '', descripcion: '', imageFile: null },
        clientes: { nombre: '', telefono: '', direccion: '', estado: true },
        productos: {
          nombre: '', descripcion: '', precio: '', stock: '', categoriaRef: recordId(records.categorias[0] || {}), estado: true, imageFile: null,
        },
        pedidos: {
          clienteRef: recordId(records.clientes[0] || {}), fecha: today(), estado: false, metodoPago: true,
          detalles: [{ productoRef: recordId(records.productos[0] || {}), cantidad: '1', precio: records.productos[0]?.precio || '' }],
        },
        creditos: {
          clienteRef: recordId(records.clientes[0] || {}), productoRef: recordId(records.productos[0] || {}),
          fecha: today(), descripcion: '', montoTotal: '', saldoPendiente: '', estado: false,
          abonos: [{ fecha: today(), monto: '' }],
        },
      };
      return defaults[entity];
    }
    function totalForDetails(details = []) {
      return details.reduce((sum, row) => sum + (Number(row.cantidad) || 0) * (Number(row.precio) || 0), 0);
    }
    function validatePedidoStock(detalles) {
      const totals = new Map();
      for (const row of detalles) {
        const product = state.records.productos.find(item => recordId(item) === row.productoRef);
        if (!product) return `Producto no encontrado en el pedido.`;
        if (product.estado === false) return `"${product.nombre}" está inactivo.`;
        const qty = Number(row.cantidad) || 0;
        if (qty <= 0) return 'Cada cantidad debe ser mayor que cero.';
        const next = (totals.get(row.productoRef) || 0) + qty;
        totals.set(row.productoRef, next);
        if (next > Number(product.stock)) return `Stock insuficiente para "${product.nombre}". Disponible: ${product.stock}.`;
      }
      return '';
    }
    function openEditor(entity, record = null) {
      state.editor = { entity, record, form: createForm(entity, record), saving: false };
      renderEditor();
      document.getElementById('editorScrim').classList.add('open');
      document.getElementById('editorScrim').setAttribute('aria-hidden', 'false');
    }
    function closeEditor() {
      state.editor = null;
      document.getElementById('editorScrim').classList.remove('open');
      document.getElementById('editorScrim').setAttribute('aria-hidden', 'true');
      document.getElementById('editorForm').replaceChildren();
      const err = document.getElementById('editorError');
      err.hidden = true;
      err.textContent = '';
    }
    function setEditorError(message) {
      const err = document.getElementById('editorError');
      err.textContent = message || '';
      err.hidden = !message;
    }
    function renderEditor() {
      if (!state.editor) return;
      const { entity, record, form } = state.editor;
      const config = moduleByKey(entity);
      document.getElementById('editorKicker').textContent = record ? 'ACTUALIZAR' : 'NUEVO REGISTRO';
      document.getElementById('editorTitle').textContent = config?.label || entity;
      document.getElementById('editorSave').textContent = state.editor.saving ? 'Guardando…' : (record ? 'Guardar cambios' : 'Registrar');
      document.getElementById('editorSave').disabled = state.editor.saving;
      const wrap = document.getElementById('editorForm');
      wrap.replaceChildren();
      const setField = (key, value) => {
        state.editor.form[key] = value;
        renderEditor();
      };
      if (entity === 'pedidos') {
        wrap.append(buildReferenceField('Cliente', form.clienteRef, state.records.clientes, value => setField('clienteRef', value)));
        wrap.append(buildTextField('Fecha', form.fecha, value => setField('fecha', value)));
        wrap.append(buildBooleanField('Estado', form.estado, [['En proceso', false], ['Completado', true]], value => setField('estado', value)));
        wrap.append(buildBooleanField('Pago', form.metodoPago, [['Efectivo', true], ['Tarjeta', false]], value => setField('metodoPago', value)));
        (form.detalles || []).forEach((row, index) => {
          const line = make('div', 'order-line');
          line.append(buildReferenceField(`Producto ${index + 1}`, row.productoRef, state.records.productos, value => {
            const product = state.records.productos.find(item => recordId(item) === value);
            const next = [...form.detalles];
            next[index] = { ...next[index], productoRef: value, precio: product?.precio || '' };
            setField('detalles', next);
          }));
          const inline = make('div', 'inline-fields');
          inline.append(buildTextField('Cantidad', row.cantidad, value => {
            const next = [...form.detalles]; next[index] = { ...next[index], cantidad: value }; setField('detalles', next);
          }, 'number'));
          inline.append(buildTextField('Precio', row.precio, () => {}, 'number', true));
          line.append(inline);
          const foot = make('div', 'catalog-foot');
          foot.append(make('strong', '', money((Number(row.cantidad) || 0) * (Number(row.precio) || 0))));
          if ((form.detalles || []).length > 1) {
            const remove = make('button', 'cart-remove', 'Quitar'); remove.type = 'button';
            remove.addEventListener('click', () => setField('detalles', form.detalles.filter((_, i) => i !== index)));
            foot.append(remove);
          }
          line.append(foot);
          wrap.append(line);
        });
        const addLine = make('button', 'secondary-button', '+ Agregar producto'); addLine.type = 'button';
        addLine.addEventListener('click', () => setField('detalles', [...(form.detalles || []), { productoRef: '', cantidad: '1', precio: '' }]));
        wrap.append(addLine);
        const total = make('div', 'checkout-total');
        total.append(make('span', '', 'TOTAL DEL PEDIDO'), make('strong', '', money(totalForDetails(form.detalles))));
        wrap.append(total);
        return;
      }
      if (entity === 'creditos') {
        wrap.append(buildReferenceField('Cliente', form.clienteRef, state.records.clientes, value => setField('clienteRef', value)));
        wrap.append(buildReferenceField('Producto', form.productoRef, state.records.productos, value => setField('productoRef', value)));
        wrap.append(buildTextField('Fecha', form.fecha, value => setField('fecha', value)));
        wrap.append(buildTextField('Descripción', form.descripcion, value => setField('descripcion', value), 'text', false, true));
        wrap.append(buildTextField('Monto total', form.montoTotal, value => setField('montoTotal', value), 'number'));
        wrap.append(buildTextField('Saldo pendiente', form.saldoPendiente, value => setField('saldoPendiente', value), 'number'));
        wrap.append(buildBooleanField('Estado', form.estado, [['Pendiente', false], ['Cancelado', true]], value => setField('estado', value)));
        (form.abonos || []).forEach((payment, index) => {
          const line = make('div', 'inline-fields');
          line.append(buildTextField('Fecha abono', payment.fecha, value => {
            const next = [...form.abonos]; next[index] = { ...next[index], fecha: value }; setField('abonos', next);
          }));
          line.append(buildTextField('Monto', payment.monto, value => {
            const next = [...form.abonos]; next[index] = { ...next[index], monto: value }; setField('abonos', next);
          }, 'number'));
          wrap.append(line);
        });
        const addAbono = make('button', 'secondary-button', '+ Agregar abono'); addAbono.type = 'button';
        addAbono.addEventListener('click', () => setField('abonos', [...(form.abonos || []), { fecha: today(), monto: '' }]));
        wrap.append(addAbono);
        return;
      }
      const fields = {
        categorias: [['nombre', 'Nombre'], ['descripcion', 'Descripción', true]],
        clientes: [['nombre', 'Nombre'], ['telefono', 'Teléfono'], ['direccion', 'Dirección', true]],
        productos: [['nombre', 'Nombre'], ['descripcion', 'Descripción', true], ['precio', 'Precio'], ['stock', 'Existencias']],
      }[entity] || [];
      fields.forEach(([key, label, multiline]) => {
        wrap.append(buildTextField(label, form[key], value => setField(key, value), multiline ? 'text' : (key === 'precio' || key === 'stock' ? 'number' : 'text'), false, multiline));
      });
      if (entity === 'productos') {
        wrap.append(buildReferenceField('Categoría', form.categoriaRef, state.records.categorias, value => setField('categoriaRef', value)));
        wrap.append(buildBooleanField('Estado', form.estado, [['Activo', true], ['Inactivo', false]], value => setField('estado', value)));
      }
      if (entity === 'clientes') {
        wrap.append(buildBooleanField('Estado', form.estado, [['Activo', true], ['Inactivo', false]], value => setField('estado', value)));
      }
      if (entity === 'categorias' || entity === 'productos') {
        const block = make('div', 'form-field');
        block.append(make('label', 'field-label', `Imagen ${record ? '(opcional al actualizar)' : '(obligatoria)'}`));
        const previewUrl = form.imageFile ? URL.createObjectURL(form.imageFile) : (form.imagenUrl || form.imagen);
        if (previewUrl && validImage(previewUrl)) {
          const img = make('img', 'image-preview'); img.src = previewUrl; block.append(img);
        }
        const file = make('input', 'form-input'); file.type = 'file'; file.accept = 'image/*';
        file.addEventListener('change', () => { state.editor.form.imageFile = file.files?.[0] || null; renderEditor(); });
        block.append(file);
        wrap.append(block);
      }
    }
    function buildTextField(label, value, onChange, type = 'text', readOnly = false, multiline = false) {
      const field = make('div', 'form-field');
      field.append(make('label', 'field-label', label));
      const input = multiline ? make('textarea', 'form-textarea') : make('input', 'form-input');
      if (!multiline) input.type = type === 'number' ? 'number' : 'text';
      input.value = value == null ? '' : String(value);
      input.readOnly = readOnly;
      if (!readOnly) input.addEventListener('input', event => onChange(event.target.value));
      field.append(input);
      return field;
    }
    function buildReferenceField(label, value, options, onChange) {
      const field = make('div', 'form-field');
      field.append(make('label', 'field-label', label));
      if (!options?.length) {
        field.append(make('p', '', 'Registra primero una opción.'));
        return field;
      }
      const row = make('div', 'choice-row');
      options.forEach(option => {
        const id = recordId(option);
        const chip = make('button', `choice-chip${value === id ? ' active' : ''}`, option.nombre || id);
        chip.type = 'button';
        chip.addEventListener('click', () => onChange(id));
        row.append(chip);
      });
      field.append(row);
      return field;
    }
    function buildBooleanField(label, value, choices, onChange) {
      const field = make('div', 'form-field');
      field.append(make('label', 'field-label', label));
      const row = make('div', 'choice-row');
      choices.forEach(([text, choiceValue]) => {
        const chip = make('button', `choice-chip${value === choiceValue ? ' active' : ''}`, text);
        chip.type = 'button';
        chip.addEventListener('click', () => onChange(choiceValue));
        row.append(chip);
      });
      field.append(row);
      return field;
    }
    async function saveEditor() {
      if (!state.editor || state.editor.saving) return;
      const { entity, record, form } = state.editor;
      const config = moduleByKey(entity);
      setEditorError('');
      const multipart = entity === 'categorias' || entity === 'productos';
      if (multipart && !record && !form.imageFile) {
        setEditorError('Selecciona una imagen para continuar.');
        return;

      if (entity === 'pedidos') {
        if (!form.clienteRef || !form.detalles?.length || form.detalles.some(row => !row.productoRef)) {
          setEditorError('Elige un cliente y al menos un producto.');
          return;
        }
        if (!record) {
          const stockMsg = validatePedidoStock(form.detalles);
          if (stockMsg) { setEditorError(stockMsg); return; }
        }
      }
      if (entity === 'creditos' && (!form.clienteRef || !form.productoRef)) {
        setEditorError('Elige un cliente y un producto.');
        return;

      state.editor.saving = true;
      renderEditor();

        const payload = { ...form };
        delete payload.imageFile;
        delete payload.imagenUrl;
        delete payload.imagen;

        if (entity === 'pedidos') {
          payload.detalles = payload.detalles.map(row => ({

            precio: Number(row.precio),
            subtotal: (Number(row.cantidad) || 0) * (Number(row.precio) || 0),
          }));

      });
      const checkout = make('section', 'checkout-panel');
      checkout.append(make('h2', '', 'Confirmar pedido'));
      if (!state.records.clientes.length) {
        checkout.append(make('p', 'page-subtitle', 'Registra al menos un cliente en el backend para poder enviar pedidos.'));
      } else {
        const label = make('label', 'field-label', 'Cliente');
        label.htmlFor = 'checkoutCliente';
        const select = make('select', 'select-input');
        select.id = 'checkoutCliente';
        if (!state.checkout.clienteRef) state.checkout.clienteRef = recordId(state.records.clientes[0]);
        state.records.clientes.forEach(cliente => {
          const option = make('option', '', cliente.nombre || recordId(cliente));
          option.value = recordId(cliente);
          if (recordId(cliente) === state.checkout.clienteRef) option.selected = true;
          select.append(option);
        });
        select.addEventListener('change', event => { state.checkout.clienteRef = event.target.value; });
        checkout.append(label, select);
        checkout.append(make('span', 'field-label', 'Método de pago'));
        const payment = make('div', 'payment-toggle');
        [['Efectivo', true], ['Tarjeta', false]].forEach(([labelText, value]) => {
          const button = make('button', `payment-option${state.checkout.metodoPago === value ? ' active' : ''}`, labelText);
          button.type = 'button';
          button.addEventListener('click', () => { state.checkout.metodoPago = value; render(); });
          payment.append(button);
        });
        checkout.append(payment);
      }
      const total = make('div', 'checkout-total');
      total.append(make('span', '', 'TOTAL'), make('strong', '', money(cartGrandTotal())));
      checkout.append(total);
      const confirm = make('button', 'primary-button', state.checkout.submitting ? 'Enviando pedido…' : 'Confirmar pedido');
      confirm.type = 'button';
      confirm.disabled = state.checkout.submitting || !state.records.clientes.length;
      confirm.addEventListener('click', submitCartOrder);
      const keepShopping = make('button', 'secondary-button', 'Seguir comprando');
      keepShopping.type = 'button';
      keepShopping.style.marginTop = '10px';
      keepShopping.addEventListener('click', () => setRoute('catalog'));
      checkout.append(confirm, keepShopping);
      layout.append(list, checkout);
      page.append(layout);
    }
    function render() {
      syncNavigation(); page.replaceChildren();
      const screen = current().screen;
      if (screen === 'home') showHome();
      else if (screen === 'catalog') showCatalog();
      else if (screen === 'cart') showCart();
      else if (screen === 'detail') showDetail();
      else if (screen === 'orders') showRecords('Pedidos', 'Registra ventas y consulta su estado.', 'pedidos', { createLabel: '+ Nuevo pedido', editable: true });
      else if (screen === 'history') {
        page.append(pageHeading('MOVIMIENTOS', 'Historial', 'Pedidos y créditos registrados.'));
        const segments = make('div', 'segments'); [['pedidos', 'Pedidos'], ['creditos', 'Créditos']].forEach(([key, label]) => { const button = make('button', `segment${state.historyKind === key ? ' active' : ''}`, label); button.addEventListener('click', () => { state.historyKind = key; state.search = ''; render(); }); segments.append(button); });
        page.append(segments);
        showRecords('', '', state.historyKind, {
          createLabel: state.historyKind === 'creditos' ? '+ Crédito' : null,
          editable: state.historyKind === 'creditos',
        });
      } else if (screen === 'profile') showProfile();
      else if (screen === 'clients') {
        const heading = pageHeading('CLIENTES', 'Clientes', 'Contactos guardados en el negocio.');
        const back = make('button', 'text-button', '‹ Volver al perfil'); back.type = 'button';
        back.addEventListener('click', () => setRoute('profile'));
        heading.append(back);
        page.append(heading);
        showRecords('', '', 'clientes', { createLabel: '+ Nuevo cliente', editable: true });
      }
      else showHome();
    }
    async function loadCollections() {
      if (state.loading) return;
      state.loading = true; connection.classList.remove('online'); connection.textContent = 'Actualizando';
      const refreshButton = document.getElementById('refresh'); refreshButton.disabled = true; setNotice(''); render();
      const results = await Promise.allSettled(modules.map(async module => {
        const response = await fetch(`${API_URL}${module.path}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.mensaje || data.message || `Error ${response.status}`);
        if (!Array.isArray(data)) throw new Error('El servidor no devolvió una lista.');
        return data;
      }));
      const unavailable = [];
      results.forEach((result, index) => {
        const module = modules[index];
        if (result.status === 'fulfilled') state.records[module.key] = result.value;
        else { state.records[module.key] = []; unavailable.push(module.label); }
      });
      state.loading = false; refreshButton.disabled = false;
      const loaded = modules.length - unavailable.length;
      connection.classList.toggle('online', loaded > 0); connection.textContent = loaded === modules.length ? 'Conectado' : `${loaded}/${modules.length} módulos`;
      if (unavailable.length) setNotice(`No se pudieron cargar: ${unavailable.join(', ')}.`);
      if (!state.checkout.clienteRef && state.records.clientes[0]) state.checkout.clienteRef = recordId(state.records.clientes[0]);
      state.cart = state.cart.filter(item => productById(item.productoRef)).map(item => {
        const product = productById(item.productoRef);
        return { ...item, precio: Number(product?.precio ?? item.precio), nombre: product?.nombre || item.nombre };
      });
      persistCart();
      render();
    }
    document.getElementById('menuButton').addEventListener('click', () => drawer.classList.contains('open') ? closeDrawer() : openDrawer());
    drawerScrim.addEventListener('click', closeDrawer);
    document.getElementById('refresh').addEventListener('click', loadCollections);
    document.getElementById('cartButton').addEventListener('click', () => setRoute('cart'));
    document.getElementById('editorClose').addEventListener('click', closeEditor);
    document.getElementById('editorCancel').addEventListener('click', closeEditor);
    document.getElementById('editorSave').addEventListener('click', saveEditor);
    document.getElementById('editorScrim').addEventListener('click', event => {
      if (event.target.id === 'editorScrim') closeEditor();
    });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeDrawer(); });
    syncCartBadge();
    render(); loadCollections();
  </script>
</body>
</html>
